<h2>Redefinir sua senha</h2>
<p>Recebemos um pedido para redefinir a senha da sua conta no Sindicondo.</p>
<p>Use o código abaixo para concluir a redefinição:</p>
<p style="font-size: 28px; font-weight: bold; letter-spacing: 6px">
  {{ .Token }}
</p>
<p>
  O código expira em 1 hora. Se você não fez este pedido, ignore este e-mail.
</p>
