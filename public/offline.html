<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0f766e" />
    <title>Sem conexão | Sindicondo</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        padding: 40px 16px;
        background: #f6f7f9;
        color: #111827;
        font:
          14px/1.5 system-ui,
          sans-serif;
      }
      main {
        max-width: 420px;
        margin: 0 auto;
        padding: 28px;
        border: 1px solid #e5e7eb;
        border-radius: 14px;
        background: white;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 9px;
        font-size: 17px;
        font-weight: 700;
      }
      svg {
        width: 26px;
        height: 26px;
      }
      h1 {
        margin: 20px 0 8px;
        font-size: 24px;
        line-height: 1.45;
      }
      p {
        margin: 0 0 20px;
        color: #4b5563;
      }
      a {
        display: flex;
        min-height: 44px;
        align-items: center;
        justify-content: center;
        padding: 11px 14px;
        border-radius: 8px;
        background: #0f766e;
        color: white;
        font-weight: 600;
        text-decoration: none;
        cursor: pointer;
      }
      a:hover {
        background: #0b5e58;
      }
      a:active {
        background: #084c47;
      }
      a:focus-visible {
        outline: 2px solid #0f766e;
        outline-offset: 3px;
      }
      @media (max-width: 560px) {
        main {
          padding: 22px 18px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="brand">
        <svg viewBox="0 0 26 26" aria-hidden="true">
          <rect width="26" height="26" rx="7" fill="#0F766E" />
          <rect x="6" y="7" width="14" height="3" rx="1.5" fill="#FEE4E2" />
          <rect x="6" y="11.5" width="10" height="3" rx="1.5" fill="#fff" />
          <rect
            x="6"
            y="16"
            width="7"
            height="3"
            rx="1.5"
            fill="#fff"
            opacity="0.7"
          />
        </svg>
        Sindicondo
      </div>
      <h1>Sem conexão</h1>
      <p>
        Conecte-se à internet para continuar. Cadastros, confirmações e outras
        ações precisam de conexão.
      </p>
      <a href="">Tentar novamente</a>
    </main>
  </body>
</html>
